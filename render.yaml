services:
  - type: web
    name: curie-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn curie.backend.api.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: CURIE_CORS_ORIGINS
        sync: false
      - key: CURIE_LOG_LEVEL
        value: INFO
      - key: CURIE_LOG_FORMAT
        value: json
