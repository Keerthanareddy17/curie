[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "curie"
version = "0.1.0"
description = "An autonomous, evidence-aware biological research agent. Research and education software only."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }

dependencies = [
    "langgraph>=1.0,<2.0",
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.4",
    "structlog>=24.1",
    "google-genai>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
curie = "curie.cli:main"

[tool.setuptools.packages.find]
include = ["curie*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["network: exercises a real external API call (needs internet access)"]
